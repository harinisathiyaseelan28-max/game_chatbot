<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameSpark</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #12182c;
    --panel-2: #182142;
    --accent-1: #ff5f6d;
    --accent-2: #ffc371;
    --accent-3: #7c5cff;
    --text: #f1f1fa;
    --muted: #9aa0c0;
    --user-bubble: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    --bot-bubble: #1e2748;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 80% -10%, #2a1a3d 0%, var(--bg) 55%);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }

  .app {
    width: 100%;
    max-width: 760px;
    height: 92vh;
    background: var(--panel);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.06);
  }

  header {
    padding: 18px 22px;
    background: linear-gradient(120deg, var(--panel-2), var(--panel));
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: conic-gradient(from 180deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    flex-shrink: 0;
  }

  header h1 { font-size: 17px; margin: 0; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  .chat-window {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: pop 0.18s ease-out;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: #24140f;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg.typing { display: flex; gap: 4px; align-items: center; padding: 14px 18px; }

  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  form {
    display: flex;
    gap: 10px;
    padding: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: var(--panel-2);
  }

  #user-input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #user-input:focus { border-color: var(--accent-1); }

  button.send {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border: none;
    color: #241004;
    font-weight: 700;
    padding: 0 20px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
  }
  button.send:disabled { opacity: 0.5; cursor: not-allowed; }

  .chat-window::-webkit-scrollbar { width: 8px; }
  .chat-window::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
</style>
</head>
<body>

  <div class="app">
    <header>
      <div class="logo">🎮</div>
      <div>
        <h1>GameSpark</h1>
        <p>Your game creation idea partner</p>
      </div>
    </header>

    <div class="chat-window" id="chat-window">
      <div class="msg bot">
        Hey! I'm GameSpark 🎮 Tell me about the game you're dreaming up — genre, mechanics, story, anything — and I'll help you brainstorm.
      </div>
    </div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Describe your game idea..." autocomplete="off" required>
      <button type="submit" class="send">Send</button>
    </form>
  </div>

<script>
  const chatWindow = document.getElementById('chat-window');
  const chatForm = document.getElementById('chat-form');
  const userInput = document.getElementById('user-input');
  const sendButton = chatForm.querySelector('button.send');
  const sessionId = 'session-' + Math.random().toString(36).slice(2);

  function addMessage(text, sender) {
    const bubble = document.createElement('div');
    bubble.className = 'msg ' + sender;
    bubble.textContent = text;
    chatWindow.appendChild(bubble);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return bubble;
  }

  function showTyping() {
    const bubble = document.createElement('div');
    bubble.className = 'msg bot typing';
    bubble.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    chatWindow.appendChild(bubble);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return bubble;
  }

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = userInput.value.trim();
    if (!message) return;

    addMessage(message, 'user');
    userInput.value = '';
    sendButton.disabled = true;
    const typingBubble = showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message, session_id: sessionId })
      });
      const data = await res.json();
      typingBubble.remove();
      addMessage(data.reply || 'Sorry, no response received.', 'bot');
    } catch (err) {
      typingBubble.remove();
      addMessage('Network error: could not reach the server.', 'bot');
    } finally {
      sendButton.disabled = false;
      userInput.focus();
    }
  });
</script>

</body>
</html>
